<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="feedback-card.css">
    <title>Feedback Card</title>
</head>

<body>

    <div class="containers rating-container">
        <div class="score">
            <p>⭐ 9.4</p>
            <p>Vote now</p>
        </div>
        <div class="question">What do you think about this anime?</div>

        <div class="rating-options">
            <div class="rating-option " style="background-color: #D1D0D2;">
                <p>😐</p>
                <p>Boring</p>
            </div>
            <div class="rating-option" style="background-color: #DCDCDD;">
                <p>😃</p>
                <p>Great</p>
            </div>
            <div class="rating-option" style="background-color: #E9E9EA;">
                <p>😍</p>
                <p>Amazing</p>
            </div>
        </div>
    </div>

</body>

</html>
